<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in · Personal Knowledge Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Same night-lab tokens as index.html: one narrow console panel, centered. */
:root {
  --bg: #0a0c0f;
  --bg-raise: #10141a;
  --fg: #dfe4ea;
  --fg-2: #a9b2bd;
  --fg-3: #8590a0;
  --line: #1e242d;
  --line-2: #2a323e;
  --accent: #79e2ff;
  --accent-glow: rgba(121, 226, 255, .18);
  --accent-ink: #04141a;
  --danger: #ff9a9a;

  --sans: "IBM Plex Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fs-meta: 0.75rem;
  --fs-sm: 0.875rem;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center;
  padding-block: 48px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  color: var(--fg); font-family: var(--sans); font-size: 1rem; line-height: 1.6;
  background:
    radial-gradient(60rem 28rem at 50% -8rem, rgba(121, 226, 255, .07), transparent 70%),
    var(--bg);
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 1.5px solid var(--accent); outline-offset: 3px; border-radius: 4px; box-shadow: 0 0 0 4px var(--accent-glow); }
::selection { background: var(--accent); color: var(--accent-ink); }

.panel { width: 100%; max-width: 380px; animation: boot .6s cubic-bezier(.2,.8,.2,1) both; }
.mark {
  display: inline-grid; place-items: center; height: 40px; padding: 0 10px;
  font-family: var(--mono); font-size: 1rem; font-weight: 500; letter-spacing: 0.08em; line-height: 1;
  color: var(--accent); background: rgba(121, 226, 255, .06);
  border: 1px solid rgba(121, 226, 255, .45); border-radius: 9px;
  text-shadow: 0 0 10px rgba(121, 226, 255, .45);
  box-shadow: 0 0 16px rgba(121, 226, 255, .12), inset 0 0 8px rgba(121, 226, 255, .06);
}
h1 { margin: 18px 0 4px; font-size: 1.625rem; font-weight: 500; letter-spacing: -0.02em; line-height: 1.2; text-wrap: balance; }
.sub { margin: 0 0 24px; font-family: var(--mono); font-size: var(--fs-meta); color: var(--fg-3); }

form { display: grid; gap: 12px; padding: 20px; background: var(--bg-raise); border: 1px solid var(--line-2); border-radius: 12px; }
label { font-family: var(--mono); font-size: var(--fs-meta); color: var(--fg-3); margin-bottom: -6px; }
input {
  width: 100%; padding: 10px 12px; font-family: var(--mono); font-size: var(--fs-sm); color: var(--fg);
  background: var(--bg); border: 1px solid var(--line-2); border-radius: 8px; outline: 0; transition: border-color .2s, box-shadow .2s;
}
input:focus { border-color: rgba(121, 226, 255, .55); box-shadow: 0 0 0 3px var(--accent-glow); }
button {
  margin-top: 6px; padding: 11px 16px; border: 0; border-radius: 8px; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); font: inherit; font-size: var(--fs-sm); font-weight: 600;
  transition: box-shadow .2s, transform .1s;
}
button:hover:not(:disabled) { box-shadow: 0 0 18px rgba(121, 226, 255, .35); }
button:active:not(:disabled) { transform: scale(.98); }
button:disabled { opacity: .6; cursor: default; }
#status { min-height: 1.6em; margin: 12px 0 0; font-size: var(--fs-sm); color: var(--danger); }

@keyframes boot {
  from { opacity: 0; transform: translateY(8px); filter: blur(3px); }
  to { opacity: 1; transform: none; filter: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}
</style>
</head>
<body>
<main class="panel">
  <span class="mark" aria-hidden="true">PKC</span>
  <h1>Personal Knowledge Collection</h1>
  <p class="sub">log in to your library</p>
  <form id="login-form">
    <label for="email">email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button id="login-btn" type="submit">Log in</button>
  </form>
  <p id="status" role="alert"></p>
</main>
<script>
const form = document.getElementById("login-form");
const statusEl = document.getElementById("status");
const btn = document.getElementById("login-btn");

form.addEventListener("submit", async e => {
  e.preventDefault();
  statusEl.textContent = "";
  btn.disabled = true;
  btn.textContent = "Logging in…";
  try {
    const r = await fetch("/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
      }),
    });
    if (r.ok) { location.href = "/"; return; }
    const data = await r.json().catch(() => null);
    statusEl.textContent = (data && typeof data.detail === "string") ? data.detail : `Login failed (${r.status})`;
  } catch {
    statusEl.textContent = "Network error — is the server running?";
  } finally {
    btn.disabled = false;
    btn.textContent = "Log in";
  }
});
</script>
</body>
</html>
